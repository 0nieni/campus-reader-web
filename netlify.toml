[build]
  command = "npm run build --workspace=@campus/web"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  VITE_BACKEND = "netlify"
  VITE_AI_EXECUTOR = "netlify"
  VITE_CLOUDBASE_ENV_ID = "cloudbase-d3gw62aemba0c819e"
  VITE_CLOUDBASE_REGION = "ap-shanghai"
  VITE_CLOUDBASE_REGION_VERIFIED = "false"
  VITE_CLOUDBASE_FUNCTION = "webGateway"
  VITE_CLOUDBASE_AI_FUNCTION = "webAi"
  VITE_CLOUDBASE_PASSWORD_READY = "true"

[functions]
  node_bundler = "esbuild"

[functions.cleanup]
  schedule = "17 18 * * *"

[functions.reminders]
  schedule = "0 1,12 * * *"

[functions.api]
  external_node_modules = ["unpdf", "word-extractor", "xlsx", "yauzl"]
[functions.material-collect-background]
  external_node_modules = ["unpdf", "word-extractor", "xlsx", "yauzl"]
[functions.material-file]
  external_node_modules = ["unpdf", "word-extractor", "xlsx", "yauzl"]
[functions.material-schedule]
  schedule = "45 18 * * *"

# The Netlify monorepo package directory is apps/web. Resolve migrations from
# the repository base explicitly instead of package-directory auto-detection.
[database.migrations]
  path = "netlify/database/migrations"

# PR14's existing preview applied the AI migration before main's reminders.
# Keep that preview's original names and checksums; production and new branches
# use the canonical history above, with AI appended after the reminder migrations.
[context.AI_module.database.migrations]
  path = "netlify/database/pr14-migrations"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/reminder-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
